<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84b6f4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Book icon -->
  <g transform="translate(96, 80)">
    <!-- Book pages -->
    <path d="M160 0 C100 0 60 20 60 20 L60 280 C60 280 100 260 160 260 C220 260 260 280 260 280 L260 20 C260 20 220 0 160 0 Z" fill="white" opacity="0.95"/>
    <!-- Book spine/center -->
    <path d="M160 0 L160 260" stroke="#84b6f4" stroke-width="4" fill="none"/>
    <!-- Left page lines -->
    <g stroke="#84b6f4" stroke-width="6" stroke-linecap="round" opacity="0.6">
      <line x1="85" y1="60" x2="135" y2="60"/>
      <line x1="85" y1="90" x2="140" y2="90"/>
      <line x1="85" y1="120" x2="130" y2="120"/>
      <line x1="85" y1="150" x2="145" y2="150"/>
      <line x1="85" y1="180" x2="125" y2="180"/>
    </g>
    <!-- Right page lines -->
    <g stroke="#84b6f4" stroke-width="6" stroke-linecap="round" opacity="0.6">
      <line x1="185" y1="60" x2="235" y2="60"/>
      <line x1="185" y1="90" x2="230" y2="90"/>
      <line x1="185" y1="120" x2="240" y2="120"/>
      <line x1="185" y1="150" x2="225" y2="150"/>
      <line x1="185" y1="180" x2="235" y2="180"/>
    </g>
    <!-- Pen -->
    <g transform="translate(200, 200) rotate(45)">
      <rect x="0" y="0" width="20" height="120" rx="3" fill="#f59e0b"/>
      <polygon points="10,120 0,145 20,145" fill="#1f2937"/>
      <rect x="0" y="0" width="20" height="25" rx="3" fill="#fbbf24"/>
    </g>
  </g>
</svg>
